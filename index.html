<style>
  :root {
    --naranja: #FF904E;
    --naranja-oscuro: #E8742F;
    --negro: #373B44;
    --gris: #6B7280;
    --fondo: #F6F5F3;
    --tarjeta: #FFFFFF;
    --borde: #E7E4E0;
    --verde-wa: #25D366;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  button { font: inherit; cursor: pointer; }

  /* Encabezado fijo: logo, buscador y categorías */

  .fila-logo {

    max-width: 1200px; margin: 0 auto; padding: 10px 16px 8px;
  }
  .fila-logo img { height: 44px; width: auto; }

  .buscador { max-width: 1200px; margin: 0 auto; padding: 0 16px 8px; }
  .buscador input {

  .buscador input:focus { border-color: var(--naranja); background: #fff; }
  .categorias { max-width: 1200px; margin: 0 auto; padding: 0 16px 10px; }

  }
  .categorias select:focus { outline: none; border-color: var(--naranja); }
  /* En pantallas anchas: buscador y categorías en la misma fila */
  @media (min-width: 760px) {
    .filtros { display: flex; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 16px 10px; }

    .filtros .buscador { flex: 2; }
    .filtros .categorias { flex: 1; }
  }

  /* Cuadrícula: 2 columnas en celular, más en pantallas grandes */
  main { max-width: 1200px; margin: 0 auto; padding: 14px 16px 90px; }
  .grilla { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px)  { .grilla { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  @media (min-width: 960px)  { .grilla { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1200px) { .grilla { grid-template-columns: repeat(5, 1fr); } }
  .producto {
    display: flex; flex-direction: column;
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px;
    overflow: hidden; text-align: left; padding: 0; color: inherit;
    transition: box-shadow .15s, transform .15s;
  }
  .producto:hover { box-shadow: 0 6px 18px rgba(55,59,68,.12); transform: translateY(-2px); }
  .producto .foto { aspect-ratio: 1; background: #fff; display: flex; position: relative; }
  .condicion {
    position: absolute; top: 8px; left: 8px;
    background: var(--negro); color: #fff; font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;

  .condicion.nuevo { background: var(--naranja); }

  .producto .titulo {

    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;

  .vacio { text-align: center; color: var(--gris); padding: 40px 0; }

  .ficha {
    position: fixed; inset: 0; z-index: 20; display: none;

  .cerrar {

    width: 40px; height: 40px; border-radius: 50%; border: none;

    box-shadow: 0 1px 6px rgba(0,0,0,.2);

    aspect-ratio: 1; background: #fff;
  }
  .galeria::-webkit-scrollbar { display: none; }
  .galeria img { flex: none; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; }
  .puntos { display: flex; justify-content: center; gap: 6px; padding: 8px 0 0; min-height: 18px; }
  .puntos span { width: 7px; height: 7px; border-radius: 50%; background: var(--borde); }
  .puntos span.activo { background: var(--naranja); }
  .texto-ficha { padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
  .texto-ficha h2 { margin: 0; font-size: 20px; line-height: 1.3; }
  .texto-ficha .precio { font-size: 26px; margin: 0; }
  .estado { margin: 0; font-size: 15px; }
  .estado b { color: var(--naranja-oscuro); }
  .nota-estado {
    margin: 0; font-size: 14px; line-height: 1.4;
    background: #FFF4EC; border-left: 3px solid var(--naranja); padding: 8px 10px; border-radius: 6px;
  }
  .datos-tecnicos { margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .datos-tecnicos div { background: var(--fondo); border-radius: 10px; padding: 10px 12px; }
  .datos-tecnicos h3 { margin: 0 0 4px; font-size: 14px; }
  .datos-tecnicos p { margin: 0; white-space: pre-line; font-size: 14px; line-height: 1.5; }
  .mas-info {

  .etiquetas { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; }

  .descripcion { white-space: pre-line; line-height: 1.5; margin: 0; }
  .pie-ficha {

const WHATSAPP = "59171503003";
const $ = (id) => document.getElementById(id);
let categoria = "";
let condicion = "";
// true si la ficha se abrió desde la grilla (y no con un link compartido)
let abiertaAqui = false;

// "Cámara" y "camara" cuentan igual al buscar
const simple = (t) => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
for (const p of PRODUCTOS) p.busqueda = simple(`${p.titulo} ${p.descripcion} ${p.compatible} ${p.categoria} ${p.codigo}`);

const enlaceWa = (p) =>
  `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Hola, me interesa ${p.codigo} ${p.titulo} (${p.precio} Bs)`)}`;

function tarjeta(p) {
  const b = document.createElement("button");
  b.className = "producto";
  b.innerHTML = `
    <div class="foto"><img loading="lazy" alt=""><span class="condicion"></span></div>
    <div class="datos"><p class="titulo"></p><span class="precio">${p.precio} Bs</span></div>`;
  b.querySelector("img").src = p.fotos[0];
  b.querySelector(".titulo").textContent = p.titulo;
  const etiqueta = b.querySelector(".condicion");
  etiqueta.textContent = p.condicion;
  etiqueta.classList.toggle("nuevo", p.condicion === "Nuevo");
  b.onclick = () => { abiertaAqui = true; location.hash = p.codigo; };
  return b;
}

function mostrar() {
  const palabras = simple($("buscar").value).split(/\s+/).filter(Boolean);
  const lista = PRODUCTOS.filter((p) =>
    (!categoria || p.categoria === categoria) && (!condicion || p.condicion === condicion) &&
    palabras.every((w) => p.busqueda.includes(w)));
  $("grilla").replaceChildren(...lista.map(tarjeta));
  $("vacio").hidden = lista.length > 0;
  $("total").textContent = `${lista.length} productos`;
}

$("buscar").addEventListener("input", mostrar);
$("categorias").addEventListener("change", (e) => {
  categoria = e.target.value;
  window.scrollTo(0, 0);
  mostrar();
});

$("condiciones")?.addEventListener("change", (e) => {
  condicion = e.target.value;
  window.scrollTo(0, 0);
  mostrar();
});

// La ficha se abre con #P-0001 en la dirección: el botón Atrás del celular la cierra
// y ese link se puede compartir para mostrar un producto directo
function abrirFicha() {
  const p = PRODUCTOS.find((x) => x.codigo === location.hash.slice(1));
  $("ficha").classList.toggle("abierta", !!p);
  document.body.style.overflow = p ? "hidden" : "";
  if (!p) { abiertaAqui = false; return; }
  $("galeria").replaceChildren(...p.fotos.map((f) => Object.assign(new Image(), { src: f, alt: "" })));
  $("galeria").scrollLeft = 0;
  $("puntos").replaceChildren(...(p.fotos.length > 1 ? p.fotos.map(() => document.createElement("span")) : []));
  marcarPunto();
  $("f-titulo").textContent = p.titulo;
  $("f-precio").textContent = `${p.precio} Bs`;
  $("f-condicion").textContent = p.condicion;
  $("f-detalle").textContent = p.detalle ? `📝 ${p.detalle}` : "";
  $("f-detalle").hidden = !p.detalle;
  $("f-etiquetas").replaceChildren(...[p.categoria, p.codigo].filter(Boolean)
    .map((t) => Object.assign(document.createElement("span"), { textContent: t })));
  $("f-descripcion").textContent = p.descripcion;
  $("f-tecnicos").replaceChildren(...[
    ["📏 Medidas", p.medidas], ["⚙️ Características", p.caracteristicas], ["🔧 Compatible con", p.compatible],
  ].filter(([, texto]) => texto).map(([titulo, texto]) => {
    const caja = document.createElement("div");
    caja.append(Object.assign(document.createElement("h3"), { textContent: titulo }),
                Object.assign(document.createElement("p"), { textContent: texto }));
    return caja;
  }));
  $("f-wa").href = enlaceWa(p);
  $("f-info").href = `https://www.google.com/search?q=${encodeURIComponent(p.nombre)}`;
}
function marcarPunto() {
  const g = $("galeria");
  const i = Math.round(g.scrollLeft / (g.clientWidth || 1));
  [...$("puntos").children].forEach((s, j) => s.classList.toggle("activo", i === j));
}
function cerrarFicha() {
  if (abiertaAqui) history.back();
  else { history.replaceState(null, "", location.pathname); abrirFicha(); }
}
$("galeria").addEventListener("scroll", marcarPunto);
$("cerrar").onclick = cerrarFicha;
$("ficha").addEventListener("click", (e) => { if (e.target === $("ficha")) cerrarFicha(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && location.hash) cerrarFicha(); });
window.addEventListener("hashchange", abrirFicha);

mostrar();
abrirFicha();
</script>
